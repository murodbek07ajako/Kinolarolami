<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<link rel="icon" href="/logo.png">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>MEGA CINEMA</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0c13;--bg2:#10131f;--card:#151a2b;--line:#222a42;--text:#f4f6fc;--muted:#8f98b5;--a1:#ff4d6d;--a2:#ff9248;--ok:#3ddc97;--grad:linear-gradient(135deg,var(--a1),var(--a2))}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overscroll-behavior:none}
body{padding-bottom:calc(28px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.top{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 85%,transparent);padding:14px 14px 2px}
.brand{display:flex;align-items:center;gap:10px;padding-right:50px}
.brand img{width:44px;height:44px;border-radius:12px;object-fit:cover;flex:none;box-shadow:0 4px 16px rgba(255,77,109,.35)}
.brand-name{font-family:"Bebas Neue",Impact,"Arial Narrow",sans-serif;font-size:31px;line-height:1;letter-spacing:3px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 22px rgba(255,77,109,.25)}
#favbtn{flex:none;width:34px;height:34px;border-radius:10px;font-size:19px;line-height:1;display:flex;align-items:center;justify-content:center;background:var(--bg2);border:1px solid var(--line);transition:transform .15s,background .2s,border-color .2s}
#favbtn:active{transform:scale(.88)}
#favbtn .fi{filter:grayscale(1);opacity:.6;transition:.2s}
#favbtn.on{border-color:var(--a1);background:rgba(255,77,109,.16)}
#favbtn.on .fi{filter:none;opacity:1}
.hero-s{margin:2px 0 14px}
.hs-track{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:20px}
.hs-track::-webkit-scrollbar{display:none}
.hs{position:relative;flex:none;width:100%;aspect-ratio:16/9;scroll-snap-align:center;border-radius:20px;overflow:hidden;border:1px solid var(--line);cursor:pointer}
.hs .poster{position:absolute;inset:0;aspect-ratio:auto;border-radius:0}
.hs-shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(10,12,19,.92) 8%,rgba(10,12,19,.25) 55%,transparent)}
.hs-tx{position:absolute;left:14px;right:14px;bottom:12px}
.hs-t{font-weight:800;font-size:20px;line-height:1.15;letter-spacing:-.2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.hs-m{color:#d4d9ec;font-size:12.5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hs-go{display:inline-block;margin-top:9px;padding:7px 16px;border-radius:99px;background:var(--grad);font-weight:700;font-size:13px;box-shadow:0 6px 18px rgba(255,77,109,.35)}
.hs-dots{display:flex;justify-content:center;gap:6px;margin-top:9px}
.hs-dots i{width:6px;height:6px;border-radius:99px;background:var(--line);transition:.25s}
.hs-dots i.on{width:18px;background:var(--a1)}
.countrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 2px 10px}
.countrow .count{margin:0}
.sortwrap{position:relative;flex:none}
#sortbtn{padding:6px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--muted)}
.sortmenu{position:absolute;right:0;top:38px;z-index:15;min-width:176px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 14px 34px rgba(0,0,0,.55)}
.sortmenu button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:600;color:var(--muted)}
.sortmenu button.on{background:rgba(255,77,109,.16);color:var(--text)}
.epb.seen{background:rgba(61,220,151,.1);border-color:rgba(61,220,151,.4);color:var(--ok)}
.epb.last{outline:2px solid var(--a1);outline-offset:1px}
.simrow{display:flex;gap:10px;overflow-x:auto;padding:8px 16px 4px;scrollbar-width:none}
.simrow::-webkit-scrollbar{display:none}
.sim{flex:none;width:106px;cursor:pointer}
.sim .poster{border-radius:12px;border:1px solid var(--line)}
.sim .st{font-size:12px;font-weight:600;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hi{font-size:21px;font-weight:800;letter-spacing:-.3px;padding-right:50px}
.hi b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.gear{position:absolute;right:14px;top:12px;width:42px;height:42px;border-radius:13px;background:var(--card);border:1px solid var(--line);font-size:20px;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.gear:active{transform:scale(.92)}
.gear[hidden]{display:none}
.search{display:flex;align-items:center;gap:8px;margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 12px;height:46px;transition:border-color .2s}
.search:focus-within{border-color:var(--a1)}
.search svg{flex:none;opacity:.55}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font-size:15px;height:100%}
.search input::placeholder{color:var(--muted)}
.search input::-webkit-search-cancel-button{display:none}
#clr{flex:none;width:24px;height:24px;border-radius:50%;background:var(--line);font-size:11px}
.tabs,.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.tabs{margin-top:12px}
.tabs button{flex:none;padding:8px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:13px;color:var(--muted);transition:.2s}
.tabs button.on{background:var(--grad);border-color:transparent;color:#fff}
.chips{margin:10px 0 6px;padding-bottom:4px}
.chips:empty{display:none}
.chips button{flex:none;padding:5px 12px;border-radius:99px;border:1px solid var(--line);font-size:12.5px;color:var(--muted);transition:.2s}
.chips button.on{border-color:var(--a1);color:var(--text);background:rgba(255,77,109,.14)}
main{padding:4px 14px}
.count{color:var(--muted);font-size:12.5px;margin:6px 2px 10px;min-height:1em}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:520px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border-radius:16px;overflow:hidden;border:1px solid var(--line);cursor:pointer;transition:transform .15s;animation:in .4s both}
.card:active{transform:scale(.97)}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.poster{position:relative;aspect-ratio:2/3;background:var(--bg2);overflow:hidden}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .4s}
.poster img.ok{opacity:1}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:800;color:rgba(255,255,255,.8)}
.shade{position:absolute;left:0;right:0;bottom:0;height:45%;background:linear-gradient(transparent,rgba(10,12,19,.9))}
.badge{position:absolute;top:8px;padding:3px 8px;border-radius:8px;font-size:11px;font-weight:700;background:rgba(10,12,19,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.badge.q{left:8px;color:#ffd166}.badge.y{right:8px}
.views{position:absolute;left:8px;bottom:8px;font-size:11.5px;font-weight:600}
.meta{padding:9px 10px 11px}
.t{font-weight:700;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.8em}
.g{color:var(--muted);font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1.4em}
.sk{aspect-ratio:2/3.85;border-radius:16px;background:linear-gradient(90deg,var(--card) 25%,#1e2439 37%,var(--card) 63%);background-size:400% 100%;animation:sh 1.3s infinite}
@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}
.empty{text-align:center;color:var(--muted);padding:56px 20px}
.empty .e{font-size:50px;margin-bottom:8px}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:4px}
#sentinel{height:1px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.62);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.overlay.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:92vh;overflow:auto;background:var(--bg2);border-radius:24px 24px 0 0;border-top:1px solid var(--line);transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.8,.2,1);padding-bottom:calc(18px + env(safe-area-inset-bottom))}
.sheet.on{transform:none}
.grab{width:42px;height:4px;border-radius:9px;background:var(--line);margin:10px auto 8px}
.hero{display:flex;gap:14px;padding:6px 16px}
.hero .poster{width:118px;flex:none;border-radius:14px}
.hero .info{min-width:0;flex:1}
.hero h2{margin:2px 0 10px;font-size:20px;line-height:1.2;letter-spacing:-.2px}
.tag{display:inline-block;margin:0 6px 6px 0;padding:3px 9px;border-radius:8px;background:var(--card);border:1px solid var(--line);font-size:12px;color:var(--muted)}
.rows{padding:6px 16px 0;color:var(--muted);font-size:13.5px}
.rows div{margin:3px 0}.rows b{color:var(--text);font-weight:600}
.desc{padding:10px 16px 0;font-size:14px;color:#c9cfe3;white-space:pre-line}
.acts{display:flex;gap:10px;padding:16px 16px 0}
.btn{height:52px;border-radius:15px;font-weight:700;font-size:15.5px}
.btn.main{flex:1;background:var(--grad);color:#fff;box-shadow:0 8px 22px rgba(255,77,109,.28)}
.btn.main:disabled{opacity:.65}
.btn.fav{width:56px;background:var(--card);border:1px solid var(--line);font-size:21px}
.loader{padding:60px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translate(-50%,30px);background:#fff;color:#111;padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ───────── Admin ───────── */
.adm{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;padding-bottom:calc(34px + env(safe-area-inset-bottom));transform:translateX(100%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s .3s}
.adm.on{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.adm-top{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 88%,transparent);padding:14px 14px 6px}
.adm-title{font-size:21px;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:10px}
.adm-title .back{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:17px}
.adm-top .tabs button{flex:1 1 auto;padding:8px 8px;font-size:12.5px;white-space:nowrap}
.adm-title b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.adm-body{padding:6px 14px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px}
.stat b{display:block;font-size:24px;letter-spacing:-.4px}
.stat span{color:var(--muted);font-size:12.5px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:12px}
.panel h3{margin:0 0 6px;font-size:15.5px}
.lbl{display:block;margin:14px 0 6px;color:var(--muted);font-size:12.5px;font-weight:600}
.lbl i{font-style:normal;color:var(--a1)}
.inp{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--text);font-size:15px;outline:0;font-family:inherit}
.inp:focus{border-color:var(--a1)}
textarea.inp{min-height:96px;resize:vertical;line-height:1.4}
.qchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.qchips button{padding:5px 11px;border-radius:99px;border:1px solid var(--line);font-size:12.5px;color:var(--muted);transition:.15s}
.qchips button.on{border-color:var(--a1);color:var(--text);background:rgba(255,77,109,.14)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .grow{flex:1;min-width:0}
.row .nm{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sm{color:var(--muted);font-size:12px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rank{width:24px;color:var(--muted);font-weight:700;font-size:13px;text-align:center;flex:none}
.ico{width:38px;height:38px;border-radius:11px;background:var(--bg2);border:1px solid var(--line);flex:none;font-size:16px}
.ico:active{transform:scale(.92)}
.sw{position:relative;width:50px;height:30px;border-radius:99px;background:var(--line);flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--a1)}
.sw.on::after{transform:translateX(20px)}
.note{color:var(--muted);font-size:12.5px;margin-top:8px;line-height:1.45}
.notice{background:rgba(255,146,72,.12);border:1px solid rgba(255,146,72,.4);border-radius:14px;padding:12px 14px;margin-bottom:4px;font-size:13.5px;line-height:1.45}
.btn.full{width:100%;margin-top:18px}
.btn2{margin-top:10px;padding:9px 14px;border-radius:11px;background:var(--bg2);border:1px solid var(--line);font-size:13px;font-weight:600}
.addrow{display:flex;gap:8px;margin-top:12px}
.addrow .inp{flex:1;min-width:0}
.addrow button{flex:none;padding:0 14px;border-radius:12px;background:var(--grad);color:#fff;font-weight:700;font-size:14px}
.more{display:block;width:100%;margin-top:12px;padding:11px;border-radius:12px;border:1px solid var(--line);color:var(--muted);font-weight:600;font-size:13.5px}
.kinds{margin-top:10px}
.kinds button{padding:6px 12px;font-size:12.5px}
.epgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:8px;padding:6px 16px 0}
.epb{height:46px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:15px}
.epb:active{transform:scale(.94)}
.epb.pend{opacity:.55;border-style:dashed}
.epb:disabled{opacity:.5}
.sec{padding:14px 16px 0;font-weight:700;font-size:14px}
.badge.e{left:8px;color:#8ee3ff}
.bigbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:12px;padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.bigbtn:active{transform:scale(.98)}
.bigbtn .bi{font-size:28px;flex:none}
.bigbtn b{display:block;font-size:16px}
.bigbtn span{color:var(--muted);font-size:12.5px}
.bigbtn .cnt{margin-left:auto;flex:none;min-width:34px;text-align:center;padding:4px 10px;border-radius:99px;background:var(--grad);color:#fff;font-weight:800;font-size:14px}
.grp{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.grp .gh{display:flex;align-items:center;gap:10px;cursor:pointer}
.grp .gh b{font-size:15px}
.grp .gh .cnt{margin-left:auto;padding:3px 10px;border-radius:99px;background:var(--grad);color:#fff;font-weight:800;font-size:13px}
.grp .items{margin-top:6px}
.grp .pub{display:flex;gap:8px;margin-top:10px}
.grp .pub button{flex:1;padding:10px 8px;border-radius:12px;font-weight:700;font-size:13px;background:var(--grad);color:#fff}
.grp .pub button.q{background:var(--bg2);border:1px solid var(--line);color:var(--text)}
[hidden]{display:none!important}
.swrow{display:flex;align-items:center;gap:12px;margin-top:14px}
.swrow .grow{flex:1}
.back2{margin-bottom:4px}
.sel{appearance:none;-webkit-appearance:none}
.done{text-align:center;padding:30px 8px 10px}
.done .e{font-size:58px;margin-bottom:6px}
.done h2{margin:0 0 8px;font-size:20px}
.done p{margin:0 auto;max-width:320px;color:var(--muted);line-height:1.5;font-size:14px}
.done .btn{width:100%;margin-top:22px}
.poster.logo img{object-fit:contain;padding:18%}
.cover{position:relative;aspect-ratio:16/9;margin:2px 16px 12px;border-radius:16px;overflow:hidden;background:linear-gradient(135deg,#2a1f4d,#15101f)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .4s}
.cover img.ok{opacity:1}
.cover.logo img{object-fit:contain;padding:5%}
.cvbox{margin:12px 0 4px}
.cvbox .cover{margin:6px 0 4px}
.cvbtns{display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><img src="/logo.png" alt="Mega Cinema"><span class="brand-name">MEGA CINEMA</span></div>
  <button class="gear" id="gear" hidden aria-label="Admin panel">⚙️</button>
  <label class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Kino nomi, janr yoki yil..." autocomplete="off" enterkeyhint="search">
    <button id="clr" hidden aria-label="Tozalash">✕</button>
    <button id="favbtn" type="button" aria-label="Saralangan" aria-pressed="false"><span class="fi">⭐</span></button>
  </label>
  <div class="tabs kinds" id="kinds">
    <button data-kind="kino">🎬 Kino</button>
    <button data-kind="multfilm">🧸 Multfilm</button>
    <button data-kind="serial">📺 Serial</button>
    <button data-kind="anime">🎌 Anime</button>
  </div>
  <div class="chips" id="chips"></div>
</header>

<main>
  <section class="hero-s" id="heroS" hidden>
    <div class="hs-track" id="hsTrack"></div>
    <div class="hs-dots" id="hsDots"></div>
  </section>
  <div class="countrow">
    <div class="count" id="count"></div>
    <div class="sortwrap" id="sortwrap">
      <button id="sortbtn" type="button">⇅ <span id="sortlbl">Yangi</span></button>
      <div class="sortmenu" id="sortmenu" hidden>
        <button data-order="new" class="on">🆕 Yangi</button>
        <button data-order="top">🔥 Top</button>
        <button data-order="year">📅 Yil bo'yicha</button>
      </div>
    </div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden></div>
  <div id="sentinel"></div>
</main>

<div class="overlay" id="ov"></div>
<section class="sheet" id="sheet" aria-modal="true"></section>

<section class="adm" id="adm" aria-modal="true">
  <div class="adm-top">
    <div class="adm-title"><button class="back" id="admBack" aria-label="Orqaga">←</button><span>⚙️ <b>Admin panel</b></span></div>
    <div class="tabs" id="admTabs">
      <button data-tab="stats" class="on">📊 Stat</button>
      <button data-tab="add">🎬 Qo'shish</button>
      <button data-tab="movies">📋 Kinolar</button>
      <button data-tab="auto">📥 Avto</button>
      <button data-tab="settings">⚙️ Sozlama</button>
    </div>
  </div>
  <div class="adm-body" id="admBody"></div>
</section>

<div class="toast" id="toast"></div>

<script>
(() => {
  const tg = window.Telegram && Telegram.WebApp;
  try { tg.ready(); tg.expand(); tg.setHeaderColor('#0a0c13'); tg.setBackgroundColor('#0a0c13'); } catch (e) {}

  const $ = s => document.querySelector(s);
  const initData = (tg && tg.initData) || '';
  const PAGE = 20;
  const S = { q: '', genre: '', kind: '', sort: 'new', order: 'new', autoOpen: false, offset: 0, loading: false, done: false, gen: 0, favs: new Set(), favChanged: false, genres: [] };

  const haptic = (t = 'light') => { try { tg.HapticFeedback.impactOccurred(t); } catch (e) {} };
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const fmt = n => n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1).replace('.0', '') + 'k' : String(n);
  const hue = id => (id * 47) % 360;

  function toast(msg, ms = 2300) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), ms);
  }

  async function api(path, body) {
    const r = await fetch(path, {
      method: body !== undefined ? 'POST' : 'GET',
      headers: { 'X-Init-Data': initData, 'Content-Type': 'application/json' },
      body: body !== undefined ? JSON.stringify(body) : undefined,
    });
    if (!r.ok) {
      let msg = '';
      try { msg = (await r.json()).error || ''; } catch (e) {}
      const e = new Error(msg || 'http ' + r.status); e.status = r.status; e.msg = msg; throw e;
    }
    return r.json();
  }

  /* ───────── Poster ───────── */
  /* Rasm faqat shu ilova ichida: muqova bo'lsa — o'sha, bo'lmasa (yoki yuklanmasa) — logo */
  const LOGO = '/logo.png';
  const coverUrl = (m, type) => ((type || m.t) === 's' ? '/api/scover/' : '/api/cover/') + m.id + '?v=' + m.cv;
  function coverImg(box, m, type) {
    const img = new Image();
    img.alt = ''; img.decoding = 'async';
    img.onload = () => img.classList.add('ok');
    const useLogo = () => { box.classList.add('logo'); img.onerror = () => img.remove(); img.src = LOGO; };
    if (m && m.cv) { img.onerror = useLogo; img.src = coverUrl(m, type); } else useLogo();
    box.appendChild(img);
  }
  const tint = m => { const hh = hue(m.id + (m.t === 's' ? 7 : 0)); return `linear-gradient(135deg,hsl(${hh} 55% 32%),hsl(${(hh + 55) % 360} 60% 20%))`; };
  function posterBox(m) {
    const box = el('div', 'poster');
    box.style.background = tint(m);
    coverImg(box, m);
    return box;
  }
  function coverBanner(m) {
    const box = el('div', 'cover');
    box.style.background = tint(m);
    coverImg(box, m);
    return box;
  }

  /* ───────── Kartalar ───────── */
  function card(m, i) {
    const c = el('div', 'card');
    c.style.animationDelay = (i % PAGE) * 22 + 'ms';
    const p = posterBox(m);
    p.appendChild(el('div', 'shade'));
    if (m.t === 's') p.appendChild(el('span', 'badge e', m.eps + ' qism'));
    else if (m.quality) p.appendChild(el('span', 'badge q', m.quality));
    if (m.year) p.appendChild(el('span', 'badge y', m.year));
    p.appendChild(el('span', 'views', '👁 ' + fmt(m.views)));
    c.appendChild(p);
    const meta = el('div', 'meta');
    meta.appendChild(el('div', 't', m.title));
    meta.appendChild(el('div', 'g', m.genre || m.country || ''));
    c.appendChild(meta);
    c.onclick = () => { haptic(); openSheet(m); };
    return c;
  }

  const KIND_PL = { kino: 'kinolar', multfilm: 'multfilmlar', serial: 'seriallar', anime: 'animelar' };
  const KIND_SG = { kino: 'Kino', multfilm: 'Multfilm', serial: 'Serial', anime: 'Anime' };
  const KIND_ICON = { kino: '🎬', multfilm: '🧸', serial: '📺', anime: '🎌' };
  const grid = $('#grid');
  function skeleton() { for (let i = 0; i < 6; i++) grid.appendChild(el('div', 'sk')); }
  function clearSkeleton() { grid.querySelectorAll('.sk').forEach(n => n.remove()); }

  function showEmpty() {
    const e = $('#empty'); e.replaceChildren(); e.hidden = false;
    let icon = '🔍', title = 'Hech narsa topilmadi', text = 'Boshqa so\'z yoki janrni sinab ko\'ring.';
    if (S.sort === 'fav' && !S.q && !S.genre) { icon = '⭐'; title = 'Saralanganlar bo\'sh'; text = 'Kino sahifasidagi 🤍 tugmasini bosib saqlang.'; }
    else if (!S.q && !S.genre && S.sort !== 'fav') {
      if (KIND_PL[S.kind]) { icon = KIND_ICON[S.kind]; title = 'Hozircha ' + KIND_PL[S.kind] + ' yo\'q'; text = 'Tez orada yangi ' + KIND_PL[S.kind] + ' qo\'shiladi.'; }
      else { icon = '🎬'; title = 'Hozircha kontent yo\'q'; text = 'Tez orada yangi kinolar qo\'shiladi.'; }
    }
    else if (KIND_SG[S.kind]) { icon = KIND_ICON[S.kind]; title = KIND_SG[S.kind] + ' topilmadi'; text = 'Boshqa so\'z yoki janrni sinab ko\'ring.'; }
    e.appendChild(el('div', 'e', icon)); e.appendChild(el('b', null, title)); e.appendChild(document.createTextNode(text));
  }

  function showMessage(icon, title, text) {
    grid.replaceChildren(); $('#count').textContent = '';
    const e = $('#empty'); e.replaceChildren(); e.hidden = false;
    e.appendChild(el('div', 'e', icon)); e.appendChild(el('b', null, title)); e.appendChild(document.createTextNode(text));
  }

  /* ───────── Yuklash ───────── */
  async function load(reset) {
    if (reset) {
      S.offset = 0; S.done = false; S.gen++; S.loading = false; syncUI();
      grid.replaceChildren(); $('#empty').hidden = true; skeleton();
    }
    if (S.loading || S.done) return;
    const gen = S.gen; S.loading = true;
    try {
      const qs = new URLSearchParams({ q: S.q, genre: S.genre, kind: S.kind, sort: S.sort, offset: S.offset, limit: PAGE });
      const d = await api('/api/movies?' + qs);
      if (gen !== S.gen) return;
      clearSkeleton();
      if (reset && d.genres) { S.genres = d.genres; renderChips(d.genres); }
      d.items.forEach((m, i) => grid.appendChild(card(m, S.offset + i)));
      S.offset += d.items.length;
      S.done = S.offset >= d.total || d.items.length === 0;
      $('#count').textContent = d.total ? d.total + ' ta natija' : '';
      if (d.total === 0) showEmpty();
      if (S.autoOpen) { S.autoOpen = false; if (d.total === 1 && d.items[0].t === 's') openSheet(d.items[0]); }
    } catch (e) {
      if (gen !== S.gen) return;
      clearSkeleton();
      if (e.status === 401) showMessage('🔒', 'Ruxsat yo\'q', 'Bu sahifani Telegram botdagi «Katalog» tugmasi orqali oching.');
      else toast('Yuklab bo\'lmadi. Internetni tekshiring.');
    } finally {
      if (gen === S.gen) { S.loading = false; maybeMore(); }
    }
  }

  function maybeMore() {
    if (S.loading || S.done) return;
    if ($('#sentinel').getBoundingClientRect().top < window.innerHeight + 500) load(false);
  }
  window.addEventListener('scroll', maybeMore, { passive: true });

  /* ───────── Janrlar, tablar, qidiruv ───────── */
  function renderChips(genres) {
    const box = $('#chips'); box.replaceChildren();
    if (!genres.length) return;
    const mk = (label, val) => {
      const b = el('button', S.genre === val ? 'on' : '', label);
      b.onclick = () => { S.genre = val; haptic(); box.querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on'); load(true); };
      return b;
    };
    box.appendChild(mk('Hammasi', ''));
    genres.forEach(g => box.appendChild(mk(g, g)));
  }

  /* ───────── Saralash menyusi ───────── */
  const ORDERS = { new: 'Yangi', top: 'Top', year: 'Yil bo\'yicha' };
  const sortbtn = $('#sortbtn'), sortmenu = $('#sortmenu');
  sortbtn.addEventListener('click', e => { e.stopPropagation(); haptic(); sortmenu.hidden = !sortmenu.hidden; });
  sortmenu.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    e.stopPropagation(); haptic();
    S.order = b.dataset.order;
    if (S.sort !== 'fav') S.sort = S.order;
    sortmenu.hidden = true; load(true);
  });
  document.addEventListener('click', () => { sortmenu.hidden = true; });
  function syncUI() {
    $('#sortwrap').hidden = S.sort === 'fav';
    $('#sortlbl').textContent = ORDERS[S.order] || 'Yangi';
    sortmenu.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.order === S.order));
    updateHero();
  }

  /* ───────── Hero slayder ───────── */
  const heroS = $('#heroS'), hsTrack = $('#hsTrack'), hsDots = $('#hsDots');
  let HERO = [], heroPause = 0;
  const hsStep = () => hsTrack.clientWidth + 10;
  function updateHero() {
    heroS.hidden = !(HERO.length && !S.q && !S.genre && !S.kind && S.sort !== 'fav');
  }
  function buildHero(items) {
    HERO = items || []; hsTrack.replaceChildren(); hsDots.replaceChildren();
    HERO.forEach((m, i) => {
      const s = el('div', 'hs');
      const bg = posterBox(m); s.appendChild(bg);
      s.appendChild(el('div', 'hs-shade'));
      const tx = el('div', 'hs-tx');
      tx.appendChild(el('div', 'hs-t', m.title));
      const meta = [m.year, (m.genre || '').split(',')[0].trim(), m.t === 's' ? m.eps + ' qism' : m.quality].filter(Boolean).join(' · ');
      if (meta) tx.appendChild(el('div', 'hs-m', meta));
      tx.appendChild(el('span', 'hs-go', '▶ Ko\'rish'));
      s.appendChild(tx);
      s.onclick = () => { haptic(); openSheet(m); };
      hsTrack.appendChild(s); hsDots.appendChild(el('i', i === 0 ? 'on' : ''));
    });
    updateHero();
  }
  hsTrack.addEventListener('scroll', () => {
    const i = Math.round(hsTrack.scrollLeft / (hsStep() || 1));
    hsDots.querySelectorAll('i').forEach((d, k) => d.classList.toggle('on', k === i));
  }, { passive: true });
  ['touchstart', 'pointerdown', 'wheel'].forEach(ev => hsTrack.addEventListener(ev, () => { heroPause = Date.now() + 9000; }, { passive: true }));
  setInterval(() => {
    if (heroS.hidden || HERO.length < 2 || sheetOpen || admOpen || Date.now() < heroPause) return;
    const i = (Math.round(hsTrack.scrollLeft / hsStep()) + 1) % HERO.length;
    hsTrack.scrollTo({ left: i * hsStep(), behavior: 'smooth' });
  }, 4500);

  const favbtn = $('#favbtn');
  favbtn.addEventListener('click', ev => {
    ev.preventDefault(); ev.stopPropagation();
    haptic();
    const on = S.sort !== 'fav';
    S.sort = on ? 'fav' : S.order;
    favbtn.classList.toggle('on', on); favbtn.setAttribute('aria-pressed', on);
    load(true);
  });

  $('#kinds').addEventListener('click', ev => {
    const b = ev.target.closest('button'); if (!b) return;
    haptic();
    const same = b.classList.contains('on');
    document.querySelectorAll('#kinds button').forEach(x => x.classList.toggle('on', x === b && !same));
    S.kind = same ? '' : b.dataset.kind; load(true);
  });

  const qi = $('#q'), clr = $('#clr');
  let deb;
  qi.addEventListener('input', () => {
    clr.hidden = !qi.value;
    clearTimeout(deb);
    deb = setTimeout(() => { S.q = qi.value.trim(); load(true); }, 350);
  });
  qi.addEventListener('keydown', e => { if (e.key === 'Enter') qi.blur(); });
  clr.onclick = () => { qi.value = ''; clr.hidden = true; S.q = ''; load(true); };

  /* ───────── Kino oynasi (bottom sheet) ───────── */
  const sheet = $('#sheet'), ov = $('#ov');
  let sheetOpen = false, sheetGen = 0;

  function closeSheet() {
    if (!sheetOpen) return;
    sheetOpen = false;
    sheet.classList.remove('on'); ov.classList.remove('on');
    try { tg.BackButton.offClick(closeSheet); tg.BackButton.hide(); } catch (e) {}
    if (S.favChanged && S.sort === 'fav') load(true);
    S.favChanged = false;
  }
  ov.onclick = closeSheet;

  async function openSheet(m) {
    const was = sheetOpen, gen = ++sheetGen;
    sheetOpen = true;
    sheet.replaceChildren(el('div', 'grab'), el('div', 'loader', '⏳ Yuklanmoqda...'));
    sheet.scrollTop = 0;
    sheet.classList.add('on'); ov.classList.add('on');
    if (!was) { try { tg.BackButton.onClick(closeSheet); tg.BackButton.show(); } catch (e) {} }
    try {
      const d = await api((m.t === 's' ? '/api/series/' : '/api/movie/') + m.id);
      if (gen !== sheetGen) return;
      renderSheet(d); loadSimilar(d, gen);
    } catch (e) {
      if (gen === sheetGen) { closeSheet(); toast('Topilmadi'); }
    }
  }

  async function sendToBot(id, btn, label) {
    haptic('medium');
    btn.disabled = true; btn.textContent = '⏳';
    const reset = () => { btn.disabled = false; btn.textContent = label; };
    try {
      const r = await api('/api/send', { id });
      if (r.status === 'ok') {
        toast('✅ Botga yuborildi!');
        setTimeout(() => { try { tg.close(); } catch (e) { reset(); } }, 900);
      } else if (r.status === 'sub') {
        toast('📢 Avval kanallarga obuna bo\'ling. Botga xabar yuborildi.', 3200);
        setTimeout(() => { try { tg.close(); } catch (e) { reset(); } }, 2000);
      } else { toast('⚠️ Yuborib bo\'lmadi'); reset(); }
    } catch (e) { toast('Xatolik, qayta urinib ko\'ring'); reset(); }
  }

  async function loadSimilar(m, gen) {
    try {
      const d = await api('/api/similar/' + (m.t === 's' ? 's' : 'm') + '/' + m.id);
      if (gen !== sheetGen || !sheetOpen || !d.items.length) return;
      sheet.appendChild(el('div', 'sec', '🎬 O\'xshash kontent'));
      const row = el('div', 'simrow');
      d.items.forEach(x => {
        const c = el('div', 'sim');
        const p = posterBox(x); c.appendChild(p);
        c.appendChild(el('div', 'st', x.title));
        c.onclick = () => { haptic(); openSheet(x); };
        row.appendChild(c);
      });
      sheet.appendChild(row);
    } catch (e) {}
  }

  const KIND_LABEL = { kino: '🎬 Kino', multfilm: '🧸 Multfilm', serial: '📺 Serial', anime: '🎌 Anime' };

  function renderSheet(m) {
    const isS = m.t === 's';
    sheet.replaceChildren(el('div', 'grab'));
    sheet.appendChild(coverBanner(m));
    const hero = el('div', 'hero');
    const info = el('div', 'info');
    info.appendChild(el('h2', null, m.title));
    if (isS || m.kind !== 'kino') info.appendChild(el('span', 'tag', KIND_LABEL[m.kind] || m.kind));
    [m.year, m.quality, m.language].filter(Boolean).forEach(t => info.appendChild(el('span', 'tag', t)));
    (m.genre || '').split(',').map(x => x.trim()).filter(Boolean).forEach(g => info.appendChild(el('span', 'tag', '🎭 ' + g)));
    hero.appendChild(info); sheet.appendChild(hero);

    const rows = el('div', 'rows');
    const add = (k, v) => { if (!v) return; const d = el('div'); d.appendChild(document.createTextNode(k + ' ')); d.appendChild(el('b', null, v)); rows.appendChild(d); };
    add('🌍 Davlat:', m.country); add('👁 Ko\'rishlar:', String(m.views)); add('🔢 Kod:', String(m.code || m.id));
    if (isS) add('🎞 Qismlar:', String(m.eps.length));
    sheet.appendChild(rows);
    if (m.description) sheet.appendChild(el('div', 'desc', m.description));

    const fk = m.fk != null ? m.fk : m.id;
    const acts = el('div', 'acts');
    const fav = el('button', 'btn fav', S.favs.has(fk) ? '❤️' : '🤍');
    if (isS) {
      const seen = new Set(m.seen || []);
      const live = m.eps.filter(e => e.live);
      const li = m.last ? live.findIndex(e => e.id === m.last) : -1;
      if (li >= 0) {
        const nx = live[li + 1], tgt = nx || live[li];
        const label = nx ? '▶ ' + nx.ep + '-qismdan davom etish' : '🔁 ' + tgt.ep + '-qismni qayta ko\'rish';
        const ca = el('div', 'acts'); ca.style.paddingTop = '12px';
        const cb = el('button', 'btn main', label);
        cb.onclick = () => sendToBot(tgt.id, cb, label);
        ca.appendChild(cb); sheet.appendChild(ca);
      }
      sheet.appendChild(el('div', 'sec', 'Qismni tanlang 👇'));
      const g = el('div', 'epgrid');
      m.eps.forEach(e => {
        const b = el('button', 'epb' + (e.live ? '' : ' pend') + (seen.has(e.id) ? ' seen' : '') + (e.id === m.last ? ' last' : ''), String(e.ep));
        b.title = e.ep + '-qism';
        b.onclick = () => sendToBot(e.id, b, String(e.ep));
        g.appendChild(b);
      });
      sheet.appendChild(g);
      fav.style.width = '100%'; acts.appendChild(fav);
    } else {
      const watch = el('button', 'btn main', '▶ Botda ko\'rish');
      watch.onclick = () => sendToBot(m.id, watch, '▶ Botda ko\'rish');
      acts.append(watch, fav);
    }
    sheet.appendChild(acts);

    fav.onclick = async () => {
      haptic();
      try {
        const r = await api('/api/fav', { id: fk });
        if (r.fav) S.favs.add(fk); else S.favs.delete(fk);
        fav.textContent = r.fav ? '❤️' : '🤍';
        S.favChanged = true;
        toast(r.fav ? '⭐ Saralanganlarga qo\'shildi' : 'Saralanganlardan olib tashlandi', 1600);
      } catch (e) { toast('Xatolik, qayta urinib ko\'ring'); }
    };
  }

  /* ═════════════ ADMIN PANEL ═════════════ */
  const adm = $('#adm'), admBody = $('#admBody');
  let admOpen = false, admTab = 'stats', admGen = 0;
  let ME = { admin: false, full: false, manage: false, perms: [], sections: [] };
  const can = p => ME.full || ME.perms.includes(p);
  const TAB_NEED = { stats: ['stats'], add: ['add'], movies: ['add', 'delete', 'publish'], auto: ['channels', 'publish'], settings: ['settings', 'channels', 'broadcast', 'manage'] };
  function applyTabs() {
    let first = null;
    document.querySelectorAll('#admTabs button').forEach(b => {
      const ok = (TAB_NEED[b.dataset.tab] || []).some(p => p === 'manage' ? ME.manage : can(p));
      b.hidden = !ok; b.style.display = ok ? '' : 'none';
      if (ok && !first) first = b.dataset.tab;
    });
    const cur = (TAB_NEED[admTab] || []).some(p => p === 'manage' ? ME.manage : can(p));
    if (!cur && first) admTab = first;
  }

  const mkBtn = (cls, text, onclick) => { const b = el('button', cls, text); b.onclick = onclick; return b; };
  const loaderBox = () => el('div', 'loader', '⏳ Yuklanmoqda...');
  const errMsg = e => (e && e.msg) || 'Xatolik, qayta urinib ko\'ring';

  function confirmDlg(msg) {
    return new Promise(res => {
      try { tg.showConfirm(msg, ok => res(!!ok)); }
      catch (e) { res(window.confirm(msg)); }
    });
  }

  function openAdmin() {
    admOpen = true; adm.classList.add('on'); adm.scrollTop = 0;
    try { tg.BackButton.onClick(closeAdmin); tg.BackButton.show(); } catch (e) {}
    showTab(admTab);
  }
  function closeAdmin() {
    if (!admOpen) return;
    admOpen = false; adm.classList.remove('on');
    try { tg.BackButton.offClick(closeAdmin); tg.BackButton.hide(); } catch (e) {}
    load(true); // kino qo'shilgan/o'chirilgan bo'lishi mumkin
  }
  $('#gear').onclick = () => { haptic(); openAdmin(); };
  $('#admBack').onclick = closeAdmin;
  $('#admTabs').addEventListener('click', ev => {
    const b = ev.target.closest('button'); if (!b) return;
    haptic(); showTab(b.dataset.tab);
  });

  const TABS = {};
  async function showTab(name) {
    admTab = name;
    document.querySelectorAll('#admTabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
    const my = ++admGen;
    admBody.replaceChildren(loaderBox());
    try {
      const node = await TABS[name]();
      if (my === admGen) admBody.replaceChildren(node);
    } catch (e) {
      if (my !== admGen) return;
      const box = el('div', 'empty');
      box.appendChild(el('div', 'e', '⚠️'));
      box.appendChild(el('b', null, 'Yuklab bo\'lmadi'));
      box.appendChild(document.createTextNode(errMsg(e)));
      box.appendChild(el('div'));
      box.appendChild(mkBtn('btn2', '🔄 Qayta urinish', () => showTab(name)));
      admBody.replaceChildren(box);
    }
  }

  /* ───── 1) Statistika ───── */
  TABS.stats = async () => {
    const s = await api('/api/admin/stats');
    const wrap = el('div');
    const grid = el('div', 'stat-grid');
    [
      ['👥 Foydalanuvchilar', s.users], ['🆕 Bugun qo\'shilgan', s.new_day],
      ['🟢 24 soatda faol', s.active_day], ['📅 7 kunda qo\'shilgan', s.new_week],
      ['🎬 Kinolar', s.movies], ['📺 Qismli kontent', s.series || 0],
      ['👁 Jami ko\'rishlar', s.views], ['📈 Bugungi ko\'rishlar', s.views_day],
      ['⏳ Kutilmoqda', s.pending], ['📢 Kanallar', s.channels],
    ].forEach(([label, val]) => {
      const c = el('div', 'stat'); c.appendChild(el('b', null, String(val))); c.appendChild(el('span', null, label)); grid.appendChild(c);
    });
    wrap.appendChild(grid);

    const top = el('div', 'panel');
    top.appendChild(el('h3', null, '🏆 Eng ko\'p ko\'rilgan kinolar'));
    if (!s.top.length) top.appendChild(el('div', 'note', 'Hozircha ko\'rishlar yo\'q.'));
    s.top.forEach((t, i) => {
      const r = el('div', 'row');
      r.appendChild(el('div', 'rank', String(i + 1)));
      const g = el('div', 'grow'); g.appendChild(el('div', 'nm', t.title)); g.appendChild(el('div', 'sm', 'kod: ' + (t.code || t.id)));
      r.appendChild(g); r.appendChild(el('div', 'sm', '👁 ' + t.views));
      top.appendChild(r);
    });
    wrap.appendChild(top);
    return wrap;
  };

  /* ───── 2) Kino qo'shish ───── */
  function doneView(title) {
    const d = el('div', 'done');
    d.appendChild(el('div', 'e', '✅'));
    d.appendChild(el('h2', null, 'Ma\'lumotlar saqlandi!'));
    const p = el('p');
    p.appendChild(document.createTextNode('«' + title + '» tayyor. Endi botga o\'ting va '));
    p.appendChild(el('b', null, 'kinoni (video yoki fayl)'));
    p.appendChild(document.createTextNode(' yuboring — bot uni avtomatik qo\'shadi. Xohlasangiz avval poster rasmini yuboring.'));
    d.appendChild(p);
    d.appendChild(mkBtn('btn main', '📤 Botga o\'tish', () => { try { tg.close(); } catch (e) { toast('Botga qaytib, kinoni yuboring'); } }));
    d.appendChild(mkBtn('btn2', '➕ Yana bitta', () => showTab('add')));
    return d;
  }

  /* Rasmni kichraytirish (telefon rasmlari katta bo'ladi): 1280px gacha, JPEG */
  async function shrinkImage(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = new Image(); img.src = url; await img.decode();
      const k = Math.min(1, 1280 / img.naturalWidth);
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.naturalWidth * k)); c.height = Math.max(1, Math.round(img.naturalHeight * k));
      const g = c.getContext('2d'); g.fillStyle = '#0b0b12'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      return await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('blob')), 'image/jpeg', 0.86));
    } finally { URL.revokeObjectURL(url); }
  }

  /* Muqova rasmi: formaning eng tepasida. Faqat ilova ichida ko'rinadi; qo'yilmasa logo chiqadi.
     F.cover — yashirin maydon: file_id; faqat o'zgargan bo'lsa (dataset.changed) serverga yuboriladi. */
  function coverField(panel, F, init, opts) {
    const box = el('div', 'cvbox');
    box.appendChild(el('label', 'lbl', 'Muqova rasmi (ilova ichida tepada ko\'rinadi)'));
    const prev = el('div', 'cover'); box.appendChild(prev);
    const hid = el('input'); hid.type = 'hidden'; F.cover = hid;
    const file = el('input'); file.type = 'file'; file.accept = 'image/*'; file.hidden = true;
    let state = init && init.cv ? 'saved' : 'none', blobUrl = '';
    const pick = mkBtn('btn2', '', () => file.click());
    const del = mkBtn('btn2', '🗑 Olib tashlash', () => { haptic(); hid.value = ''; hid.dataset.changed = '1'; state = 'none'; draw(); });
    const draw = () => {
      prev.replaceChildren(); prev.classList.remove('logo');
      const m = state === 'saved' ? init : null;
      if (state === 'new') {
        const img = new Image(); img.alt = ''; img.onload = () => img.classList.add('ok'); img.src = blobUrl; prev.appendChild(img);
      } else coverImg(prev, m, opts.coverType);
      pick.textContent = state === 'none' ? '🖼 Rasm tanlash' : '🔄 Almashtirish';
      del.hidden = state === 'none';
    };
    file.onchange = async () => {
      const f = file.files[0]; file.value = ''; if (!f) return;
      pick.disabled = true; pick.textContent = '⏳ Yuklanmoqda...';
      try {
        const blob = await shrinkImage(f);
        const fd = new FormData(); fd.append('file', blob, 'cover.jpg');
        const r = await fetch('/api/admin/cover', { method: 'POST', headers: { 'X-Init-Data': initData }, body: fd });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) { const e = new Error(d.error || ''); e.msg = d.error || ''; throw e; }
        hid.value = d.cover; hid.dataset.changed = '1';
        if (blobUrl) URL.revokeObjectURL(blobUrl);
        blobUrl = URL.createObjectURL(blob); state = 'new';
        haptic(); toast('✅ Rasm yuklandi. Oxirida «Saqlash» ni bosing.', 3000);
      } catch (e) { toast(errMsg(e), 3800); }
      finally { pick.disabled = false; draw(); }
    };
    const bar = el('div', 'cvbtns'); bar.append(pick, del);
    const note = el('div', 'note', 'Rasm qo\'ymasangiz, logo avtomatik chiqadi.'); note.style.whiteSpace = 'normal';
    box.append(bar, note, file);
    panel.appendChild(box);
    draw();
  }

  /* Maydonlar bloki: nom, yil, (sifat), janr, davlat, til, tavsif. opts.noQuality — qismli kontent uchun */
  function movieForm(panel, init, opts = {}) {
    const F = {};

      const box = el('div', 'qchips');

      const sync = () => { const cur = parts().map(x => x.toLowerCase()); box.querySelectorAll('button').forEach(b => b.classList.toggle('on', cur.includes(b.textContent.toLowerCase()))); };
      values.forEach(v => box.appendChild(mkBtn('', v, () => {

        if (multi) {
          const cur = parts(); const i = cur.findIndex(x => x.toLowerCase() === v.toLowerCase());
          if (i >= 0) cur.splice(i, 1); else cur.push(v);
          input.value = cur.join(', ');
        } else input.value = input.value === v ? '' : v;
        sync();
      })));
      input.addEventListener('input', sync); sync();
      return box;
    };

    coverField(panel, F, init, opts);
    field('title', opts.titleLabel || 'Kino nomi', true, inp('Masalan: Qasoskor', { maxLength: 120 }));

    const wrap = el('div'); wrap.appendChild(backBtn());
    if (!d.groups.length) {
      const e = el('div', 'empty'); e.appendChild(el('div', 'e', '📭')); e.appendChild(el('b', null, 'Hozircha hech narsa yo\'q'));
      e.appendChild(document.createTextNode('Kanalga kino yoki qism tashlang yoki kanal postlarini botga forward qiling.'));
      wrap.appendChild(e); return wrap;
    }
    const head = el('div', 'panel'); head.appendChild(el('h3', null, '✅ Qo\'shishga tayyor: ' + d.total));
    head.appendChild(el('div', 'note', 'Foydalanuvchilar hali ko\'rmaydi. Guruh ustiga bossangiz ro\'yxati ochiladi.'));
    wrap.appendChild(head);

    const NAMES = { kino: ['🎬', 'Kinolar'], multfilm: ['🧸', 'Multfilmlar'], anime: ['🎌', 'Animelar'] };
    const publish = async (scope, notify, count) => {
      const msg = count + ' ta chiqarilsinmi' + (notify ? ' va hamma foydalanuvchiga BITTA umumiy xabar yuborilsinmi?' : ' (xabarsiz)?');
      if (!await confirmDlg(msg)) return;
      haptic('medium');
      try {
        const r = await api('/api/admin/publish', { notify, scope });
        toast('🚀 ' + r.published + ' ta chiqarildi' + (notify ? '. Xabar yuborilmoqda...' : ''), 3200);
        autoSub(autoReady);
      } catch (e) { toast(errMsg(e)); }
    };
    d.groups.forEach(g => {
      const box = el('div', 'grp');
      const h = el('div', 'gh');
      const label = g.series
        ? KIND_LABEL[g.kind].split(' ')[0] + ' ' + g.series.title + ' (' + g.series.code + ')'
        : NAMES[g.kind][0] + ' ' + NAMES[g.kind][1];
      h.appendChild(el('b', null, label));
      h.appendChild(el('div', 'cnt', g.count + (g.series ? ' qism' : ' ta')));
      box.appendChild(h);
      const items = el('div', 'items'); items.hidden = true;
      g.items.forEach(it => {
        const r = el('div', 'row');
        const gg = el('div', 'grow');
        gg.appendChild(el('div', 'nm', g.series ? it.ep + '-qism' : it.title + (it.year ? ' (' + it.year + ')' : '')));
        gg.appendChild(el('div', 'sm', 'kod: ' + (it.code || it.id) + (it.genre && !g.series ? ' • ' + it.genre : '')));
        r.appendChild(gg);
        r.appendChild(mkBtn('ico', '🗑', async () => {
          if (!await confirmDlg('O\'chirilsinmi?')) return;
          try { await api('/api/admin/movie/delete', { id: it.id }); toast('🗑 O\'chirildi'); autoSub(autoReady); }
          catch (e) { toast(errMsg(e)); }
        }));
        items.appendChild(r);
      });
      box.appendChild(items);
      h.onclick = () => { haptic(); items.hidden = !items.hidden; };
      const pub = el('div', 'pub');
      pub.appendChild(mkBtn('', '🚀 Chiqarish + xabar', () => publish(g.key, true, g.count)));
      pub.appendChild(mkBtn('q', '🤫 Xabarsiz', () => publish(g.key, false, g.count)));
      box.appendChild(pub);
      wrap.appendChild(box);
    });
    const all = el('div', 'panel');
    all.appendChild(el('h3', null, '🚀 Hammasini birdan chiqarish'));
    all.appendChild(mkBtn('btn main full', 'Hammasi + bitta umumiy xabar', () => publish('all', true, d.total)));
    all.appendChild(mkBtn('btn2', '🤫 Hammasi xabarsiz', () => publish('all', false, d.total)));
    wrap.appendChild(all);
    return wrap;
  }

  /* ───── 4) Sozlamalar ───── */
  TABS.settings = async () => {
    const s = (can('settings') || can('channels')) ? await api('/api/admin/settings')
      : { protect_content: false, sub_required: true, channels: [], sources: [] };
    const wrap = el('div');

    const general = el('div', 'panel');
    general.appendChild(el('h3', null, '🛠 Umumiy sozlamalar'));
    const toggle = (icon, title, desc, key) => {
      const r = el('div', 'row');
      const g = el('div', 'grow'); g.appendChild(el('div', 'nm', icon + ' ' + title));
      const dsc = el('div', 'sm', desc); dsc.style.whiteSpace = 'normal'; g.appendChild(dsc);
      const sw = el('button', 'sw' + (s[key] ? ' on' : '')); sw.setAttribute('aria-label', title);
      sw.onclick = async () => {
        const next = !sw.classList.contains('on'); haptic();
        sw.classList.toggle('on', next);
        try { await api('/api/admin/setting', { key, value: next }); toast('Saqlandi ✅', 1200); }
        catch (e) { sw.classList.toggle('on', !next); toast(errMsg(e)); }
      };
      r.append(g, sw); general.appendChild(r);
    };
    toggle('🔒', 'Kontentni himoyalash', 'Forward va saqlashni taqiqlash', 'protect_content');
    toggle('📢', 'Majburiy obuna', 'Kanallarga obuna bo\'lmaguncha kino yuborilmaydi', 'sub_required');
    if (can('settings')) wrap.appendChild(general);

    const chanPanel = (title, note, kind, list) => {
      const p = el('div', 'panel');
      p.appendChild(el('h3', null, title));
      p.appendChild(el('div', 'note', note));
      if (!list.length) p.appendChild(el('div', 'note', 'Hozircha yo\'q.'));
      list.forEach(c => {
        const r = el('div', 'row');
        const g = el('div', 'grow'); g.appendChild(el('div', 'nm', c.title)); if (c.link) g.appendChild(el('div', 'sm', c.link));
        r.appendChild(g);
        r.appendChild(mkBtn('ico', '✕', async () => {
          if (!await confirmDlg('«' + c.title + '» olib tashlansinmi?')) return;
          try { await api('/api/admin/channel/delete', { kind, id: c.id }); toast('Olib tashlandi'); showTab('settings'); }
          catch (e) { toast(errMsg(e)); }
        }));
        p.appendChild(r);
      });
      const add = el('div', 'addrow');
      const i = el('input', 'inp'); i.placeholder = '@kanal_username yoki -100...';
      const b = mkBtn('', '➕ Qo\'shish', async () => {
        const ref = i.value.trim(); if (!ref) { toast('Kanalni yozing'); return; }
        b.disabled = true;
        try { await api('/api/admin/channel', { kind, ref }); toast('✅ Qo\'shildi'); showTab('settings'); }
        catch (e) { toast(errMsg(e), 3600); b.disabled = false; }
      });
      add.append(i, b); p.appendChild(add);
      return p;
    };
    if (can('channels')) wrap.appendChild(chanPanel('📢 Majburiy obuna kanallari', 'Foydalanuvchi shu kanallarga obuna bo\'lmaguncha kino ko\'ra olmaydi. Avval botni kanalga admin qiling.', 'sub', s.channels));
    const hint = el('div', 'note'); hint.textContent = '📥 Avto-yuklash kanallari endi «📥 Avto» bo\'limida.';
    if (can('channels')) wrap.appendChild(hint);
    if (can('broadcast')) wrap.appendChild(broadcastPanel());
    if (ME.manage) wrap.appendChild(await adminsPanel());
    return wrap;
  };

  /* ───── Hammaga xabar: matn + rasm yoki video ───── */
  function broadcastPanel() {
    const p = el('div', 'panel');
    p.appendChild(el('h3', null, '📣 Hammaga xabar'));
    p.appendChild(el('div', 'note', 'Matn yozing, xohlasangiz rasm yoki video qo\'shing. Xabar avval sizga, keyin barcha foydalanuvchilarga yuboriladi.'));
    const ta = el('textarea', 'inp'); ta.placeholder = 'Xabar matni...'; ta.maxLength = 3500; ta.style.marginTop = '10px';
    const file = el('input'); file.type = 'file'; file.accept = 'image/*,video/*'; file.hidden = true;
    const info = el('div', 'sm'); info.style.margin = '6px 0 0';
    const pickBtn = mkBtn('btn2', '📎 Rasm yoki video tanlash', () => file.click());
    file.onchange = () => {
      const f = file.files[0];
      if (f && f.size > 49 * 1048576) { toast('Fayl 49 MB dan katta bo\'lmasligi kerak', 3200); file.value = ''; info.textContent = ''; return; }
      info.textContent = f ? '📎 ' + f.name + ' (' + (f.size / 1048576).toFixed(1) + ' MB)' : '';
    };
    const send = mkBtn('btn main', '📤 Yuborish', async () => {
      const f = file.files[0], text = ta.value.trim();
      if (!text && !f) { toast('Matn yozing yoki rasm/video tanlang'); return; }
      if (!await confirmDlg('Xabar hamma foydalanuvchiga yuborilsinmi?')) return;
      const fd = new FormData(); fd.append('text', text); if (f) fd.append('file', f, f.name);
      send.disabled = true; send.textContent = '⏳ Yuklanmoqda...';
      try {
        const r = await fetch('/api/admin/broadcast', { method: 'POST', headers: { 'X-Init-Data': initData }, body: fd });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) { const e = new Error(d.error || 'http ' + r.status); e.msg = d.error || ''; throw e; }
        haptic('medium'); toast('✅ Yuborish boshlandi (' + d.total + ' kishi). Hisobot botga keladi.', 4200);
        ta.value = ''; file.value = ''; info.textContent = '';
      } catch (e) { toast(errMsg(e), 4200); }
      finally { send.disabled = false; send.textContent = '📤 Yuborish'; }
    });
    send.style.marginTop = '10px';
    p.append(ta, file, pickBtn, info, send);
    return p;
  }

  /* ───── Adminlar: qo'shish, huquq belgilash, ro'yxat ───── */
  async function adminsPanel() {
    const box = el('div', 'panel');
    let edit;
    const render = d => {
      box.replaceChildren(el('h3', null, '👥 Adminlar'));
      box.appendChild(el('div', 'note', 'Admin qo\'shing va nimaga ruxsat berilishini belgilang. Ro\'yxatdagi adminni bosib huquqini o\'zgartirasiz.'));
      d.admins.forEach(a => {
        const r = el('div', 'row');
        const g = el('div', 'grow');
        g.appendChild(el('div', 'nm', a.name));
        g.appendChild(el('div', 'sm', a.label + ' · ID ' + a.id));
        const inf = el('div', 'sm', a.info); inf.style.whiteSpace = 'normal'; g.appendChild(inf);
        r.appendChild(g);
        if (a.editable) { r.style.cursor = 'pointer'; r.appendChild(el('div', 'sm', '›')); r.onclick = () => { haptic(); edit(d, a); }; }
        box.appendChild(r);
      });
      box.appendChild(mkBtn('btn2', '➕ Admin qo\'shish', () => { haptic(); edit(d, null); }));
    };
    edit = (d, a) => {
      box.replaceChildren(el('h3', null, a ? '✏️ Adminni o\'zgartirish' : '➕ Yangi admin'));
      const st = { role: a ? a.role : 'admin', perms: new Set(a ? a.perms : ['add']), sections: new Set(a ? a.sections : Object.keys(d.section_labels)) };
      let idInp = null;
      if (a) box.appendChild(el('div', 'nm', a.name + ' · ID ' + a.id));
      else {
        box.appendChild(el('div', 'note', 'Admin bo\'ladigan odamning Telegram ID raqamini yozing (u @userinfobot orqali bilib oladi). U avval botga /start bosgan bo\'lsin.'));
        idInp = el('input', 'inp'); idInp.type = 'number'; idInp.inputMode = 'numeric';
        idInp.placeholder = 'Telegram ID, masalan 123456789'; idInp.style.marginTop = '10px';
        box.appendChild(idInp);
      }
      const roleRow = el('div', 'chips'); roleRow.style.marginTop = '12px';
      const body = el('div');
      const roles = [['admin', '👤 Admin (belgilangan huquqlar)']];
      if (d.can_senior) roles.push(['senior', '⭐ Starshiy admin (hamma huquq)']);
      const drawBody = () => {
        body.replaceChildren();
        if (st.role === 'senior') { body.appendChild(el('div', 'note', 'Starshiy admin hamma narsani qila oladi va oddiy adminlarni qo\'shib-o\'chiradi.')); return; }
        body.appendChild(el('div', 'note', 'Nimaga ruxsat berasiz:'));
        Object.entries(d.perm_labels).forEach(([k, label]) => {
          const r = el('div', 'row'); const g = el('div', 'grow');
          const nm = el('div', 'nm', label); nm.style.whiteSpace = 'normal'; g.appendChild(nm);
          const sw = el('button', 'sw' + (st.perms.has(k) ? ' on' : ''));
          sw.onclick = () => { haptic(); st.perms.has(k) ? st.perms.delete(k) : st.perms.add(k); sw.classList.toggle('on'); };
          r.append(g, sw); body.appendChild(r);
        });
        body.appendChild(el('div', 'note', 'Qaysi bo\'limlarga qaraydi:'));
        const chips = el('div', 'chips');
        Object.entries(d.section_labels).forEach(([k, label]) => {
          const b = mkBtn(st.sections.has(k) ? 'on' : '', label, () => { haptic(); st.sections.has(k) ? st.sections.delete(k) : st.sections.add(k); b.classList.toggle('on'); });
          chips.appendChild(b);
        });
        body.appendChild(chips);
      };
      const drawRole = () => {
        roleRow.replaceChildren();
        roles.forEach(([v, label]) => roleRow.appendChild(mkBtn(st.role === v ? 'on' : '', label, () => { st.role = v; drawRole(); drawBody(); })));
      };
      drawRole(); drawBody();
      if (roles.length > 1 || a) box.appendChild(roleRow);
      box.appendChild(body);
      const bar = el('div', 'two'); bar.style.marginTop = '14px';
      const save = mkBtn('btn main', '💾 Saqlash', async () => {
        const id = a ? a.id : (idInp.value || '').trim();
        if (!id) { toast('Telegram ID ni yozing'); return; }
        save.disabled = true;
        try {
          const r = await api('/api/admin/admin', { id, role: st.role, perms: [...st.perms], sections: [...st.sections] });
          haptic('medium'); toast(r.notified === false ? 'Saqlandi. Unga xabar bormadi (u botga /start bosmagan)' : '✅ Saqlandi', 3400);
          render(r);
        } catch (e) { toast(errMsg(e), 3800); save.disabled = false; }
      });
      bar.append(save, mkBtn('btn2', 'Bekor qilish', () => render(d)));
      box.appendChild(bar);
      if (a) box.appendChild(mkBtn('btn2', '🗑 Adminlikdan olish', async () => {
        if (!await confirmDlg('«' + a.name + '» adminlikdan olinsinmi?')) return;
        try { const r = await api('/api/admin/admin/delete', { id: a.id }); toast('Olib tashlandi'); render(r); }
        catch (e) { toast(errMsg(e), 3400); }
      }));
    };
    render(await api('/api/admin/admins'));
    return box;
  }

  /* ───────── Boshlash ───────── */
  async function init() {
    if (!initData) {
      showMessage('📱', 'Telegram orqali oching', 'Bu katalog faqat Telegram bot ichida ishlaydi.');
      return;
    }
    try {
      const me = await api('/api/me');
      S.favs = new Set(me.favs);
            if (me.admin) { ME = Object.assign(ME, me); $('#gear').hidden = false; applyTabs(); }
    } catch (e) {}
    try {
      const q0 = (new URLSearchParams(location.search).get('q') || '').trim().slice(0, 80);
      if (q0) { qi.value = q0; clr.hidden = false; S.q = q0; S.autoOpen = /^[sma]\s*\.\s*\d+$/i.test(q0); }
    } catch (e) {}
    load(true);
    api('/api/hero').then(d => buildHero(d.items)).catch(() => {});
  }
  init();
})();
</script>
