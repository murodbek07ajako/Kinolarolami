<!DOCTYPE html>
<html lang="uz"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kinolar</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#fff);--fg:var(--tg-theme-text-color,#111);--card:var(--tg-theme-secondary-bg-color,#f1f1f4);--btn:var(--tg-theme-button-color,#2481cc);--btnt:var(--tg-theme-button-text-color,#fff);--hint:var(--tg-theme-hint-color,#888)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;padding:12px}
input{width:100%;padding:12px;border:0;border-radius:12px;background:var(--card);color:var(--fg);font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0}
.chip{padding:7px 14px;border-radius:20px;background:var(--card);white-space:nowrap;font-size:14px}
.chip.on{background:var(--btn);color:var(--btnt)}
.card{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:14px;padding:12px;margin-bottom:8px}
.t{font-weight:600}.m{color:var(--hint);font-size:13px;margin-top:3px}
.b{border:0;border-radius:10px;padding:9px 12px;background:var(--btn);color:var(--btnt);font-size:14px}
.fav{background:none;border:0;font-size:22px}
.empty{text-align:center;color:var(--hint);padding:30px}
</style></head><body>
<input id="s" placeholder="🔎 Kino nomini yozing...">
<div class="chips" id="chips"></div>
<div id="list"></div>
<script>
const tg=Telegram.WebApp;tg.ready();tg.expand();
let genre="",favOnly=false,timer;
const favs=new Set(JSON.parse(localStorage.getItem("favs")||"[]"));
const save=()=>localStorage.setItem("favs",JSON.stringify([...favs]));
async function load(){
  const r=await fetch(`/api/movies?q=${encodeURIComponent(s.value)}&genre=${encodeURIComponent(genre)}`);
  const d=await r.json();
  chips.innerHTML=[["","Hammasi"],["__fav","❤️ Sevimli"],...d.genres.map(g=>[g,g])]
    .map(([v,l])=>`<div class="chip ${(v==="__fav"?favOnly:(!favOnly&&v===genre))?"on":""}" data-v="${v}">${l}</div>`).join("");
  let ms=d.movies.filter(m=>!favOnly||favs.has(m.code));
  list.innerHTML=ms.length?ms.map(m=>`<div class="card"><div><div class="t">${m.title}</div>
    <div class="m">${m.year} · ${m.genre} · ⭐${m.rating||"—"} · 👁${m.views}</div></div>
    <div><button class="fav" data-f="${m.code}">${favs.has(m.code)?"❤️":"🤍"}</button>
    <button class="b" data-c="${m.code}">▶ Ko'rish</button></div></div>`).join(""):`<div class="empty">Hech narsa topilmadi</div>`;
}
s.oninput=()=>{clearTimeout(timer);timer=setTimeout(load,300)};
chips.onclick=e=>{const v=e.target.dataset.v;if(v===undefined)return;
  favOnly=v==="__fav";genre=favOnly?"":v;load()};
list.onclick=async e=>{
  const f=e.target.dataset.f,c=e.target.dataset.c;
  if(f){const k=+f;favs.has(k)?favs.delete(k):favs.add(k);save();load()}
  if(c){const r=await fetch("/api/send",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({initData:tg.initData,code:c})});const d=await r.json();
    if(d.ok)tg.close();else tg.showAlert(d.error==="sub"?"Avval kanallarga obuna bo'ling":"Xatolik")}
};
load();
</script></body></html>
